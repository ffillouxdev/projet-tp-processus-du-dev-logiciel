<path d="M170.8 512.0 V478.0 a5.2 5.2 0 0 1 5.2 -5.2 H464 a5.2 5.2 0 0 1 5.2 5.2 V512.0 Z" class="ent-head"/>
<line x1="170" y1="512.0" x2="470" y2="512.0" stroke="#364fc7" stroke-width="1.2"/>
<text x="184" y="498.0" class="ent-name">ASSOCIATION</text>
<text x="456" y="498.0" text-anchor="end" class="ent-table">associations</text>
<text x="184" y="536.0" class="attr-id">id</text>
<text x="456" y="536.0" text-anchor="end" class="type">INTEGER</text>
<text x="184" y="558.0" class="attr">name</text>
<text x="456" y="558.0" text-anchor="end" class="type">VARCHAR(100) · UQ</text>
<text x="184" y="580.0" class="attr">description</text>
<text x="456" y="580.0" text-anchor="end" class="type">TEXT · NULL</text>
<text x="184" y="602.0" class="attr">created_at</text>
<text x="456" y="602.0" text-anchor="end" class="type">TIMESTAMPTZ</text>
<text x="184" y="624.0" class="attr">updated_at</text>
<text x="456" y="624.0" text-anchor="end" class="type">TIMESTAMPTZ</text>
</g>
<g id="tournaments">
<rect x="810" y="428.0" width="320" height="254" rx="6" class="ent-box"/>
<path d="M810.8 468.0 V434.0 a5.2 5.2 0 0 1 5.2 -5.2 H1124 a5.2 5.2 0 0 1 5.2 5.2 V468.0 Z" class="ent-head"/>
<line x1="810" y1="468.0" x2="1130" y2="468.0" stroke="#364fc7" stroke-width="1.2"/>
<text x="824" y="454.0" class="ent-name">TOURNOI</text>
<text x="1116" y="454.0" text-anchor="end" class="ent-table">tournaments</text>
<text x="824" y="492.0" class="attr-id">id</text>
<text x="1116" y="492.0" text-anchor="end" class="type">INTEGER</text>
<text x="824" y="514.0" class="attr">name</text>
<text x="1116" y="514.0" text-anchor="end" class="type">VARCHAR(150)</text>
<text x="824" y="536.0" class="attr">description</text>
<text x="1116" y="536.0" text-anchor="end" class="type">TEXT · NULL</text>
<text x="824" y="558.0" class="attr">status</text>
<text x="1116" y="558.0" text-anchor="end" class="type">VARCHAR(20) = 'draft'</text>
<text x="824" y="580.0" class="attr">max_participants</text>
<text x="1116" y="580.0" text-anchor="end" class="type">INTEGER · NULL</text>
<text x="824" y="602.0" class="attr">start_date</text>
<text x="1116" y="602.0" text-anchor="end" class="type">TIMESTAMPTZ · NULL</text>
<text x="824" y="624.0" class="attr">end_date</text>
<text x="1116" y="624.0" text-anchor="end" class="type">TIMESTAMPTZ · NULL</text>
<text x="824" y="646.0" class="attr">created_at</text>
<text x="1116" y="646.0" text-anchor="end" class="type">TIMESTAMPTZ</text>
<text x="824" y="668.0" class="attr">updated_at</text>
<text x="1116" y="668.0" text-anchor="end" class="type">TIMESTAMPTZ</text>
</g>
<line x1="300" y1="215" x2="341" y2="215" class="link"/>
<line x1="449" y1="215" x2="490" y2="215" class="link"/>
<ellipse cx="395" cy="215" rx="54" ry="30" class="rel"/>
<text x="395" y="219" text-anchor="middle" class="rel-name">DÉTENIR</text>
<text x="395" y="265" text-anchor="middle" class="rel-hint">FK refresh_tokens.user_id</text>
<text x="308" y="206" class="card">1,1</text>
<text x="482" y="206" text-anchor="end" class="card">0,n</text>
<line x1="790" y1="215" x2="841" y2="215" class="link"/>
<line x1="949" y1="215" x2="1000" y2="215" class="link"/>
<ellipse cx="895" cy="215" rx="54" ry="30" class="rel"/>
<text x="895" y="219" text-anchor="middle" class="rel-name">POSSÉDER</text>
<text x="895" y="265" text-anchor="middle" class="rel-hint">table user_roles</text>
<text x="798" y="206" class="card">0,n</text>
<text x="992" y="206" text-anchor="end" class="card">0,n</text>
<line x1="470" y1="555" x2="576" y2="555" class="link"/>
<line x1="704" y1="555" x2="810" y2="555" class="link"/>
<ellipse cx="640" cy="555" rx="64" ry="30" class="rel"/>
<text x="640" y="559" text-anchor="middle" class="rel-name">ORGANISER</text>
<text x="640" y="605" text-anchor="middle" class="rel-hint">FK tournaments.association_id</text>
<text x="478" y="546" class="card">0,n</text>
<text x="802" y="546" text-anchor="end" class="card">1,1</text>
<line x1="30" y1="707" x2="1250" y2="707" stroke="#dee2e6"/>
<text x="30" y="735" class="legend">Légende : attribut souligné = identifiant (clé primaire) · UQ = unique · NULL = facultatif · = 'draft' = valeur par défaut · gris = type PostgreSQL</text>
<text x="30" y="755" class="legend">Un utilisateur détient 0..n refresh tokens ; un token appartient à 1 seul utilisateur (ON DELETE CASCADE).</text>
<text x="30" y="775" class="legend">Un utilisateur possède 0..n rôles et un rôle est attribué à 0..n utilisateurs (table de liaison user_roles, ON DELETE CASCADE).</text>
<text x="30" y="795" class="legend">Une association organise 0..n tournois ; un tournoi est organisé par 1 seule association (ON DELETE CASCADE).</text>
</svg>
