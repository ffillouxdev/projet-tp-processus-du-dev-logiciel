<ellipse cx="440" cy="217" rx="54" ry="34" class="rel"/>
<text x="440" y="221" text-anchor="middle" class="rel-name">DÉTENIR</text>
<text x="440" y="265" text-anchor="middle" class="rel-hint">FK refresh_tokens.user_id</text>
<ellipse cx="520" cy="500" rx="80" ry="34" class="rel"/>
<text x="520" y="497" text-anchor="middle" class="rel-name">APPARTENIR</text>
