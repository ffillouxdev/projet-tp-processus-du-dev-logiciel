<ellipse cx="835" cy="760" rx="64" ry="34" class="rel"/>
<text x="835" y="764" text-anchor="middle" class="rel-name">ORGANISER</text>
<text x="835" y="810" text-anchor="middle" class="rel-hint">FK tournaments.association_id</text>
<text x="340.0" y="208.0" text-anchor="middle" class="card">1,1</text>
<text x="540.0" y="234.0" text-anchor="middle" class="card">0,n</text>
<text x="629.3" y="371.8" text-anchor="middle" class="card">0,n</text>
<text x="320.0" y="491.0" text-anchor="middle" class="card">0,n</text>
<text x="507.0" y="661.0" text-anchor="middle" class="card">0,n</text>
<text x="903.8" y="310.5" text-anchor="middle" class="card">0,n</text>
<text x="1152.0" y="617.0" text-anchor="middle" class="card">0,n</text>
<text x="690.0" y="751.0" text-anchor="middle" class="card">0,n</text>
<text x="980.0" y="777.0" text-anchor="middle" class="card">1,1</text>
<line x1="40" y1="917" x2="1340" y2="917" stroke="#dee2e6"/>
<text x="40" y="945" class="legend" xml:space="preserve">Légende : attribut souligné = identifiant (clé primaire) · UQ = unique · NULL = facultatif · = 'draft' = valeur par défaut · gris = type PostgreSQL</text>
<text x="40" y="965" class="legend" xml:space="preserve">DÉTENIR : un utilisateur détient 0..n refresh tokens ; un token appartient à 1 seul utilisateur (ON DELETE CASCADE).</text>
<text x="40" y="985" class="legend" xml:space="preserve">APPARTENIR (ternaire) : un utilisateur est membre de 0..n associations avec un rôle dans chacune ; CIF (utilisateur, association) → rôle : un seul rôle par association.</text>
<text x="40" y="1005" class="legend" xml:space="preserve">                Suppression d'un utilisateur ou d'une association → CASCADE ; un rôle encore attribué ne peut pas être supprimé (RESTRICT).</text>
<text x="40" y="1025" class="legend" xml:space="preserve">PARTICIPER : un utilisateur participe à 0..n tournois ; un tournoi a 0..n participants (ON DELETE CASCADE des deux côtés).</text>
<text x="40" y="1045" class="legend" xml:space="preserve">ORGANISER : une association organise 0..n tournois ; un tournoi est organisé par 1 seule association (ON DELETE CASCADE).</text>
</svg>
