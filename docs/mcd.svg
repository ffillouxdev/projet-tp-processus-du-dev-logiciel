<text x="612" y="504" text-anchor="start" class="rel-hint">table memberships</text>
<ellipse cx="1165" cy="470" rx="82" ry="34" class="rel"/>
<text x="1165" y="467" text-anchor="middle" class="rel-name">PARTICIPER</text>
<line x1="1095" y1="473" x2="1235" y2="473" stroke="#d9480f" stroke-width="0.8"/>
<text x="1165" y="489" text-anchor="middle" class="rel-attr">registered_at</text>
